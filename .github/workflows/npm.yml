# Publishes the package to npm when its version changes on main, with npm
# Trusted Publishing (GitHub Actions OIDC): no npm token is stored, and the
# package gets a provenance statement. On npmjs.com the package's trusted
# publisher must name this repository and this file (npm.yml). A version
# already on npm is skipped.
name: npm

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/npm.yml"
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish encela
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # npm 11.5.1 or newer is needed for Trusted Publishing; Node 24 ships it.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Already published?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "encela@$version" version > /dev/null 2>&1; then
            echo "encela@$version is already on npm; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: |
          pnpm typecheck
          pnpm test
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish --provenance --access public
